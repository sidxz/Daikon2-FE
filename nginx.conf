# This is the main Nginx configuration file.
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;
    #gzip  on;

    server_tokens off;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    include /etc/nginx/conf.d/*.conf;

    # /api/<rest> -> <rest>, cut from the raw request URI so encoded characters reach
    # the gateway unchanged. Stripping the prefix in proxy_pass would decode the path
    # first, turning %2F in SMILES (F/C=C/F) and names into real path separators.
    map $request_uri $daikon_api_uri {
        ~^/api(?<daikon_rest>/.*)$ $daikon_rest;
    }

    # /api upstream (gateway), written at container start
    include /etc/nginx/daikon/*.http.conf;

    server {
        listen       3000;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Security headers. Inherited by every location below as long as none
        # of them sets its own add_header.
        # ponytail: CSP has no script-src yet. JSME's GWT loader (jsme-editor.github.io)
        # runs inline scripts and javascript: URLs, so script-src would break the editor.
        # Self-host or iframe-sandbox JSME, then add script-src 'self' 'wasm-unsafe-eval'
        # (WASM is for RDKit) and default-src/connect-src for the deployed API + IdP.
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Handle React Router: serve the file if it exists, otherwise index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Runtime settings, written at container start. expires (not add_header)
        # keeps the security headers above; a missing file is a 404, not index.html.
        location = /config.js {
            expires -1;
            try_files $uri =404;
        }

        # /api/ proxy to the gateway (or a 404), written at container start
        include /etc/nginx/daikon/*.server.conf;

        # Specify a custom log location
        access_log  /var/log/nginx/react_app_access.log;

        # Error pages
        # error_page   500 502 503 504  /50x.html;
        # location = /50x.html {
        #     root   /usr/share/nginx/html;
        # }
    }
}
