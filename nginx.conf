# This is the main Nginx configuration file.
# nginx runs as the unprivileged nginx user (Dockerfile), so no user directive and the pid
# goes to /tmp.
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;
    #gzip  on;

    server_tokens off;

    # The only server. conf.d is not included: the base image's default.conf would add a
    # second server on port 80 without the security headers below.
    server {
        listen       3000;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # Security headers. Inherited by every location below as long as none
        # of them sets its own add_header.
        # ponytail: CSP has no script-src yet. JSME's GWT loader (jsme-editor.github.io)
        # runs inline scripts and javascript: URLs, so script-src would break the editor.
        # Self-host or iframe-sandbox JSME, then add script-src 'self' 'wasm-unsafe-eval'
        # (WASM is for RDKit) and default-src/connect-src for the deployed API + IdP.
        add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # No HSTS here: this container doesn't know whether TLS is in front of it, and HSTS
        # covers the whole hostname. Set it on the TLS terminator (ingress/load balancer).

        # Handle React Router: serve the file if it exists, otherwise index.html.
        # ponytail: build file names aren't content-hashed, so every file is revalidated
        # (expires -1 = no-cache; unchanged files come back as cheap 304s). Hash the names
        # in vite.config.js and cache /assets long-term if this load ever matters.
        location / {
            expires -1;
            try_files $uri $uri/ /index.html;
        }

        # The API is not served here: the ingress routes it (e.g. /simplegw) to the gateway.

        # Error pages
        # error_page   500 502 503 504  /50x.html;
        # location = /50x.html {
        #     root   /usr/share/nginx/html;
        # }
    }
}
