name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Daikon-Core's frontend job, minus lint: the repo has no ESLint config yet.
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deployment settings and keys never go into git
      - name: No deployment settings or keys tracked in git
        run: |
          tracked=$(git ls-files -- 'public/config.js' 'src/config/*' '.lab-config/*' '*.env' '.env.*' '*.pem' '*.key')
          if [ -n "$tracked" ]; then
            echo "::error::Deployment settings or keys are committed: $tracked"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # The build imports the auth and API settings from src/config (gitignored)
      - name: Placeholder settings
        run: |
          mkdir -p src/config
          echo 'export const OIDCConfig = {};' > src/config/authConfig.jsx
          echo 'export const AxiosConfig = {};' > src/config/axiosConfig.js
      - run: npm run build
