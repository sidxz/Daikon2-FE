services:
  daikon2-fe:
    build:
      context: .
      dockerfile: Dockerfile
    # Local only, behind the backend repo's Caddy (Daikon/src/docker-compose-with-caddy.yml).
    # Caddy serves localhost:3000 (the Entra redirect origin) and routes the API path
    # (baseURL, e.g. /simplegw) to the gateway and everything else to this container.
    ports:
      - "127.0.0.1:3005:3000"
    # Auth and API settings are built in from src/config.
