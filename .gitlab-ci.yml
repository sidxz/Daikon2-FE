image: docker:29

services:
  - docker:29-dind

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: "$CI_REGISTRY/sid/daikon-fe:$CI_COMMIT_REF_NAME"

before_script:
  - docker info
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

stages:
  - build
  - push

build:
  stage: build
  script:
    # The generic image, identical to the public one: no deployment settings inside
    - docker build -t daikon2-fe:generic .
    # Lab image = generic image + the lab's /config.js, built from a context that holds
    # only that file. DAIKON_* env vars on the container still override it; once the
    # lab deployment sets them, push the generic image and drop these steps.
    - mkdir -p .lab-config
    - |
      cat > .lab-config/config.js <<EOF
      window.__DAIKON_CONFIG__ = {
        oidcAuthority: "${AUTHORITY}",
        oidcClientId: "${CLIENT_ID}",
        oidcScope: "${SCOPE}",
        apiUrl: "${BASE_URL}",
      };
      EOF
    - printf 'FROM daikon2-fe:generic\nCOPY config.js /usr/share/nginx/html/config.js\n' | docker build -t "$IMAGE_TAG" -f - .lab-config
  only:
    - lab-main

push:
  stage: push
  script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push $IMAGE_TAG
  only:
    - lab-main
