image: docker:29

services:
  - docker:29-dind

variables:
  DOCKER_DRIVER: overlay2
  IMAGE_TAG: "$CI_REGISTRY/sid/daikon-fe:$CI_COMMIT_REF_NAME"

before_script:
  - docker info
  - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

stages:
  - build
  - push

build:
  stage: build
  script:
    # Lab image: bake the lab's settings in as /config.js. DAIKON_* env vars on the
    # container override it; once the lab deployment sets them, drop this step.
    - |
      cat > public/config.js <<EOF
      window.__DAIKON_CONFIG__ = {
        oidcAuthority: "${AUTHORITY}",
        oidcClientId: "${CLIENT_ID}",
        oidcScope: "${SCOPE}",
        apiUrl: "${BASE_URL}",
      };
      EOF
    # Build the Docker image
    - docker build -t $IMAGE_TAG .
  only:
    - lab-main

push:
  stage: push
  script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push $IMAGE_TAG
  only:
    - lab-main
